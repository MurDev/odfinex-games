services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: odfinex
      POSTGRES_PASSWORD: odfinex
      POSTGRES_DB: odfinex_games
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odfinex -d odfinex_games"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
